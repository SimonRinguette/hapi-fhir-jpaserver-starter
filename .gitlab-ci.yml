image: docker:19.03.12

variables:
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - docker:19.03.12-dind

before_script:
  - docker info

build:
  stage: build
  before_script:
     - docker login -u gitlab-ci-token -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
  script:
     - docker build -t ${CI_REGISTRY_IMAGE}/hapi-fhir:${CI_COMMIT_TAG} .
     - docker tag ${CI_REGISTRY_IMAGE}/hapi-fhir:${CI_COMMIT_TAG} ${CI_REGISTRY_IMAGE}/hapi-fhir:latest
     - docker push ${CI_REGISTRY_IMAGE}/hapi-fhir:${CI_COMMIT_TAG} 
     - docker push ${CI_REGISTRY_IMAGE}/hapi-fhir:latest     
  only:
    - tags

